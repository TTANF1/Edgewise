[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewise-semantic"
version = "0.1.0"
description = "Swappable semantic review backends for edgewise (Layer 2)"
requires-python = ">=3.10"
dependencies = [
    "edgewise-types",
    "typesafe-sdk",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["edgewise_semantic*"]
