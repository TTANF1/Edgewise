<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <pattern id="pixel" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Pixel-style edge illustration -->
  <g transform="translate(60, 50)">
    <!-- Subject (dark) -->
    <rect x="0" y="0" width="100" height="100" fill="#2d3436"/>
    <!-- Halo pixels (light, being cleaned) -->
    <rect x="96" y="20" width="12" height="12" fill="#dfe6e9" opacity="0.9"/>
    <rect x="96" y="32" width="8" height="8" fill="#dfe6e9" opacity="0.6"/>
    <rect x="96" y="44" width="6" height="6" fill="#dfe6e9" opacity="0.4"/>
    <rect x="80" y="96" width="12" height="12" fill="#dfe6e9" opacity="0.8"/>
    <rect x="68" y="96" width="8" height="8" fill="#dfe6e9" opacity="0.5"/>
    <!-- Arrow -->
    <path d="M 130 50 L 170 50" stroke="#00cec9" stroke-width="3" stroke-dasharray="4,3"/>
    <polygon points="170,45 180,50 170,55" fill="#00cec9"/>
    <!-- Clean result -->
    <rect x="190" y="0" width="100" height="100" fill="#2d3436" rx="2"/>
  </g>

  <!-- Title -->
  <text x="340" y="90" font-family="Courier New, monospace" font-size="42" font-weight="bold" fill="#fff">Edgewise</text>
  <text x="340" y="120" font-family="Courier New, monospace" font-size="16" fill="#00cec9">pixel-art cutout decontamination</text>
  <text x="340" y="145" font-family="Courier New, monospace" font-size="13" fill="#636e72">deterministic graphics + swappable semantic layer</text>

  <!-- Check marks -->
  <g transform="translate(340, 160)" font-family="Courier New, monospace" font-size="11" fill="#b2bec3">
    <text x="0" y="0">✓ flood-fill wall removal</text>
    <text x="180" y="0">✓ region analyzer</text>
    <text x="340" y="0">✓ jev optional</text>
  </g>
</svg>
