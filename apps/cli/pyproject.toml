[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewise-cli"
version = "0.1.0"
description = "Command-line pipeline for pixel-art cutout decontamination"
requires-python = ">=3.10"
dependencies = [
    "edgewise-core",
    "edgewise-semantic",
    "edgewise-types",
    "Pillow",
]

[project.scripts]
edgewise = "edgewise_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgewise_cli*"]
