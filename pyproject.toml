# Edgewise workspace root.
#
# The repo is managed as a `uv` workspace (https://docs.astral.sh/uv/):
#   uv sync          # install every member into .venv
#   uv run edgewise --help   # run the CLI
#
# Plain pip fallback (order matters, types first):
#   pip install -e packages/types -e packages/core -e packages/semantic -e apps/cli

[tool.uv.workspace]
members = [
    "packages/types",
    "packages/core",
    "packages/semantic",
    "apps/cli",
]

[tool.uv.sources]
edgewise-types = { workspace = true }
edgewise-core = { workspace = true }
edgewise-semantic = { workspace = true }
edgewise-cli = { workspace = true }
